# FedML Configuration with FedProx Strategy on Dirichlet Non-IID Partitions
# Framework: fastai | Architecture: convnext_small | Strategy: FedProx (mu=1.0) | Preprocessing: n2n_cyclegan

[general]
seed = 0                 # 0 triggers dynamic cryptographic seed (42 is forbidden)
device = "cuda"
output_dir = "results"
framework = "fastai"

[preprocessing]
preprocessing = "n2n_cyclegan"

[dataset]
name = "herlev_cervical_cytology"
num_classes = 7
batch_size = 16
non_iid = true
dirichlet_alpha = 0.5
test_split = 0.15

[model]
architecture = "convnext_small"
pretrained = true
dropout_rate = 0.2

[fedml]
strategy = "FedProx"
num_rounds = 5
num_clients = 5
local_epochs = 2
local_lr = 0.0003
proximal_mu = 1.0

[wandb]
wandb_enabled = false
project = "cervical-cells-fedml-n2n-cyclegan"
run_name = "fedml_fastai_n2n_cyclegan_fedprox_non_iid"
mode = "online"
