# FedML Configuration with Skorch Backend & Integrated Dual Preprocessing (N2N + CycleGAN)
# Framework: skorch | Architecture: convnext_small | Strategy: FedAvg | Preprocessing: n2n_cyclegan

[general]
seed = 0                 # 0 triggers dynamic cryptographic seed (42 is forbidden)
device = "cuda"
output_dir = "results"
framework = "skorch"

[preprocessing]
preprocessing = "n2n_cyclegan"

[dataset]
name = "herlev_cervical_cytology"
num_classes = 7
batch_size = 16
non_iid = false
dirichlet_alpha = 0.5
test_split = 0.15

[model]
architecture = "convnext_small"
pretrained = true
dropout_rate = 0.2

[fedml]
strategy = "FedAvg"
num_rounds = 5
num_clients = 5
local_epochs = 2
local_lr = 0.0003
proximal_mu = 1.0

[wandb]
wandb_enabled = false
project = "cervical-cells-fedml-n2n-cyclegan"
run_name = "fedml_skorch_n2n_cyclegan_fedavg"
mode = "online"
