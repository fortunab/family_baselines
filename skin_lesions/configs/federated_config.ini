# Federated Learning Skin Lesion Classification Configuration (INI Format)
# Compatible with Python standard library configparser
# Benchmark Dataset: HAM10000 / ISIC Dermoscopy Multi-Hospital Cohort

[experiment]
name = skin_lesion_federated_benchmark
algorithm = fedprox
seed = 42
device = cpu
output_dir = results
log_level = INFO

[dataset]
name = ham10000_isic_dermoscopy
num_classes = 7
total_samples = 420
image_size = 64
test_split_ratio = 0.20
classes = MEL, NV, BCC, AKIEC, BKL, DF, VASC
malignant_classes = MEL, BCC, AKIEC

[federated]
num_clients = 4
client_names = Hospital_Vienna_Derm, Center_Sydney_Melanoma, Clinic_MSK_NewYork, Hospital_Charite_Berlin
rounds = 15
local_epochs = 2
batch_size = 16
dirichlet_alpha = 0.5
client_fraction = 1.0
fedprox_mu = 0.01

[model]
architecture = resnet_derm
in_channels = 3
hidden_dim = 64
dropout = 0.25
num_classes = 7

[optimizer]
type = adamw
lr = 0.002
weight_decay = 0.0001
momentum = 0.9
lr_decay = 0.96

[wandb]
enabled = true
project = skin-lesion-fedml-dermoscopy
entity = 
mode = offline
tags = federated-learning, ham10000, isic, fedprox, skin-lesions, dermatology
notes = Federated Multi-Hospital Non-IID Dermoscopy Benchmark on 7-Class Skin Lesions

[clinical]
referral_threshold = 0.5
min_target_kappa = 0.80
min_referral_sens = 0.90
save_checkpoints = true
