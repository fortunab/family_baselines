# Vision Transformer (ViT-Base-224) Configuration for Cervical Cytology with Flower

[general]
seed = 42
device = "cuda"
output_dir = "results"
save_plots = true

[dataset]
name = "herlev_cervical_cytology"
data_path = "C:/Users/Lenovo/.gemini/antigravity/scratch/herlev_cervical_baseline/data"
image_size = 224
num_classes = 7
batch_size = 32
num_workers = 0
non_iid = false
dirichlet_alpha = 0.5
test_split = 0.15

[model]
architecture = "vit_base_patch16_224"
pretrained = true
dropout_rate = 0.1

[federated]
strategy = "FedAvg"
num_rounds = 10
num_clients = 5
local_epochs = 2
local_lr = 0.0001
proximal_mu = 1.0
fraction_fit = 1.0

[wandb]
enabled = true
project = "cervical-cells-federated-flower"
entity = ""
run_name = "vit_cervical_flower_fedavg"
mode = "online"
