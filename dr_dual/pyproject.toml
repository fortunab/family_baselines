[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-dual-db-ml-suite"
version = "1.0.0"
description = "Dual-Database Clinical Machine Learning Suite for Diabetic Retinopathy Grading and Dual-Database Harmonization (EyePACS/APTOS + Messidor-2/IDRiD & ISIC+HAM10000)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ophthalmic AI & Medical Harmonization Research Group" }
]
keywords = [
    "diabetic-retinopathy",
    "retinal-fundus",
    "dual-database",
    "dataset-harmonization",
    "isic-ham10000",
    "machine-learning-families",
    "quadratic-weighted-kappa",
    "clinical-ophthalmology"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "scikit-image>=0.20.0",
    "pandas>=2.0.0",
    "Pillow>=9.5.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ruff>=0.0.280",
    "pytest>=7.0.0"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310"]
