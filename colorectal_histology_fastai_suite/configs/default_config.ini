# ==============================================================================
# Colorectal Histology Benchmark - Default Configuration (Python configparser)
# Documentation: https://docs.python.org/3/library/configparser.html
# ==============================================================================

[PROJECT]
project_name = colorectal_histology_benchmark
experiment_name = baseline_experiment
seed = 0

[DATA]
data_dir = ./data
results_dir = ./results
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[MODEL]
framework = fastai
family = convnext
backbone = convnext_base
pretrained = true
freeze_epochs = 1

[TRAINING]
epochs = 5
batch_size = 16
learning_rate = 0.001
weight_decay = 0.01
optimizer = adamw
lr_scheduler = cosine
mixed_precision = false

[AUGMENTATION]
random_flip = true
max_rotate = 20.0
max_zoom = 1.1
max_lighting = 0.2

[TRACKING]
backend = offline
project = colorectal-histology-vlm
entity = 
tags = fastai,histology,vlm,benchmark
save_model_artifact = true
