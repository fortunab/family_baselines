# ==============================================================================
# fastai EfficientNetV2 Configuration (Python configparser)
# ==============================================================================

[PROJECT]
project_name = colorectal_histology_fastai
experiment_name = efficientnet_run
seed = 0

[DATA]
data_dir = ./data
results_dir = ./results
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[MODEL]
framework = fastai
family = efficientnet
backbone = efficientnet_b3
pretrained = true
freeze_epochs = 1

[TRAINING]
epochs = 8
batch_size = 16
learning_rate = 0.001
weight_decay = 0.01
optimizer = adamw
lr_scheduler = cosine
mixed_precision = false

[AUGMENTATION]
random_flip = true
max_rotate = 20.0
max_zoom = 1.15
max_lighting = 0.2

[TRACKING]
backend = offline
project = colorectal-histology-fastai
entity = 
tags = fastai,efficientnet,histology
save_model_artifact = true
