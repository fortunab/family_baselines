# ==============================================================================
# skorch Scikit-Learn ResNet Configuration (Python configparser)
# ==============================================================================

[PROJECT]
project_name = colorectal_histology_skorch
experiment_name = skorch_resnet_run
seed = 0

[DATA]
data_dir = ./data
results_dir = ./results
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[MODEL]
framework = skorch
family = resnet
backbone = resnet50d
pretrained = true
freeze_epochs = 0

[TRAINING]
epochs = 8
batch_size = 16
learning_rate = 0.001
weight_decay = 0.0001
optimizer = adamw
lr_scheduler = cosine
mixed_precision = false

[SKORCH]
max_epochs = 8
lr = 0.001
device = cuda
early_stopping_patience = 5
cross_val_folds = 3

[AUGMENTATION]
random_flip = true
max_rotate = 15.0
max_zoom = 1.1
max_lighting = 0.2

[TRACKING]
backend = offline
project = colorectal-histology-skorch
entity = 
tags = skorch,scikit-learn,resnet,histology
save_model_artifact = true
