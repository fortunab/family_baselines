# ==============================================================================
# Colorectal Histology Benchmark - TOML Configuration
# ==============================================================================

[PROJECT]
project_name = "colorectal_histology_toml"
experiment_name = "fastai_convnext_toml_run"
seed = 0

[DATA]
data_dir = "./data"
results_dir = "./results"
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[MODEL]
framework = "fastai"
family = "convnext"
backbone = "convnext_base"
pretrained = true
freeze_epochs = 1

[TRAINING]
epochs = 8
batch_size = 16
learning_rate = 0.0005
weight_decay = 0.01
optimizer = "adamw"
lr_scheduler = "cosine"
mixed_precision = false

[AUGMENTATION]
random_flip = true
max_rotate = 15.0
max_zoom = 1.1
max_lighting = 0.2

[TRACKING]
backend = "wandb"
project = "colorectal-histology-tracking"
entity = ""
tags = "fastai,toml,convnext,wandb"
save_model_artifact = true
