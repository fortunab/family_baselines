# ==============================================================================
# fastai Vision Transformer (ViT-Base) Configuration (Python configparser)
# ==============================================================================

[PROJECT]
project_name = colorectal_histology_fastai
experiment_name = vit_base_run
seed = 0

[DATA]
data_dir = ./data
results_dir = ./results
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[MODEL]
framework = fastai
family = vit
backbone = vit_base_patch16_224
pretrained = true
freeze_epochs = 1

[TRAINING]
epochs = 8
batch_size = 16
learning_rate = 0.0003
weight_decay = 0.05
optimizer = adamw
lr_scheduler = cosine
mixed_precision = false

[AUGMENTATION]
random_flip = true
max_rotate = 10.0
max_zoom = 1.05
max_lighting = 0.15

[TRACKING]
backend = offline
project = colorectal-histology-fastai
entity = 
tags = fastai,vit,transformer,histology
save_model_artifact = true
