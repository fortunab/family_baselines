# Herlev Cervical Cytology Pathology Foundation Suite - Microsoft BiomedCLIP Profile
# Backbone: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224 (Biomedical Vision Backbone)
# Framework: skorch

[dataset]
name = "Herlev Cervical Cytology Pap Smear"
data_dir = "data"
num_classes = 7
val_split = 0.15
test_split = 0.15
seed = 42
subsample = 0

[model]
backbone = "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
model_type = "huggingface"
embedding_dim = 512
pretrained = true

[training]
framework = "skorch"
image_size = 224
batch_size = 16
epochs = 8
early_stopping_patience = 5
learning_rate = 0.0003
weight_decay = 0.0001
device = "cuda"

[wandb]
enabled = true
project = "herlev-cytology-pathology-foundation"
entity = ""
tags = ["skorch", "foundation", "biomedclip", "microsoft", "herlev", "cytology"]

[evaluation]
results_dir = "results"
save_plots = true
