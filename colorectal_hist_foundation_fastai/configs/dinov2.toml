# ==============================================================================
# Model 4: Meta DINOv2 Vision Foundation Model (fastai + TOML + W&B)
# ==============================================================================

[project]
name = "colorectal_histology_pathology_foundation"
experiment_name = "dinov2_foundation_run"
seed = 0

[data]
data_dir = "./data"
results_dir = "./results"
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[model]
framework = "fastai"
family = "dinov2"
backbone = "facebook/dinov2-base"
model_type = "huggingface"
pretrained = true
freeze_epochs = 1
embedding_dim = 768

[training]
epochs = 8
batch_size = 16
learning_rate = 0.0003
weight_decay = 0.01
optimizer = "adamw"
lr_scheduler = "cosine"
mixed_precision = false

[augmentation]
random_flip = true
max_rotate = 15.0
max_zoom = 1.1
max_lighting = 0.2

[wandb]
enabled = true
project = "colorectal-histology-pathology-foundation"
entity = ""
tags = ["fastai", "dinov2", "meta", "foundation", "histology", "toml"]
save_artifact = true
