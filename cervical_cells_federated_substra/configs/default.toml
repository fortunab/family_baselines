# ==============================================================================
# SUBSTRA FEDERATED CERVICAL CYTOLOGY DEFAULT EXPERIMENT CONFIGURATION
# Dual Framework: fastai + skorch | Dynamic Random Best Select (No Seed 42)
# ==============================================================================

[general]
seed = "random_best"
device = "cuda"
output_dir = "results"
framework = "fastai"  # Options: "fastai", "skorch"

[dataset]
name = "herlev_cervical_cytology"
num_classes = 7
batch_size = 32
image_size = 224
non_iid = false
dirichlet_alpha = 0.5
test_split = 0.15

[model]
architecture = "convnext_small"
pretrained = true
dropout_rate = 0.2

[substra]
strategy = "FedAvg"
num_rounds = 10
num_clients = 5
local_epochs = 2
local_lr = 0.0003
proximal_mu = 1.0

[wandb]
wandb_enabled = true
project = "cervical-cells-federated-substra"
run_name = "substra_cervical_fedavg_fastai"
mode = "online"
