# Herlev Cervical Cytology Pathology Foundation Suite - Harvard UNI Profile
# Backbone: MahmoodLab/UNI (ViT-Large 100M+ patch Pathology Foundation Model)
# Framework: fastai

[dataset]
name = "Herlev Cervical Cytology Pap Smear"
data_dir = "data"
num_classes = 7
val_split = 0.15
test_split = 0.15
seed = 42
subsample = 0

[model]
backbone = "MahmoodLab/UNI"
model_type = "timm"
embedding_dim = 1024
pretrained = true

[training]
framework = "fastai"
image_size = 224
batch_size = 16
epochs = 8
freeze_epochs = 1
learning_rate = 0.0002
weight_decay = 0.01
max_rotate = 15.0
max_zoom = 1.1

[wandb]
enabled = true
project = "herlev-cytology-pathology-foundation"
entity = ""
tags = ["fastai", "foundation", "uni", "mahmoodlab", "herlev", "cytology"]

[evaluation]
results_dir = "results"
save_plots = true
