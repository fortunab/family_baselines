[workspace]
name = "cervical_cells_vae_flower_substra"
version = "1.0.0"
description = "Cervical Cytology Federated Flower & Substra with VAE Preprocessing, fastai, skorch, and Random Best Select"
authors = ["Antigravity Medical AI <medical-ai@antigravity.internal>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.24,<2.0"
packaging = ">=24.0,<26.0"
pandas = ">=2.0"
scipy = ">=1.10"
scikit-learn = ">=1.3"
scikit-image = ">=0.21"
matplotlib-base = ">=3.7"
seaborn = ">=0.12"
pillow = ">=9.5"
tqdm = ">=4.65"
toml = ">=0.10.2"
ruff = ">=0.1.0"
black = ">=23.0.0"
flake8 = ">=6.0.0"

[pypi-dependencies]
torch = ">=2.0.0"
torchvision = ">=0.15.0"
fastai = ">=2.7.12"
skorch = ">=0.15.0"
timm = ">=0.9.0"
wandb = ">=0.16.0"
flwr = ">=1.5.0"

[tasks]
test-flower-vae = "python main_federated_flower.py --preprocessing vae --subsample 15 --rounds 2"
test-flower-raw = "python main_federated_flower.py --preprocessing none --subsample 15 --rounds 2"
test-substra-vae = "python main_federated_substra.py --preprocessing vae --subsample 15 --rounds 2"
test-substra-raw = "python main_federated_substra.py --preprocessing none --subsample 15 --rounds 2"
compare = "python compare_cervical_vae.py --subsample 15 --rounds 1"
lint = "python run_linter.py"
