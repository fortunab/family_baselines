# ==============================================================================
# Model 3: EfficientNetV2 Configuration (fastai + TOML + W&B)
# ==============================================================================

[project]
name = "colorectal_histology_fastai"
experiment_name = "efficientnet_v2_run"
seed = 0

[data]
data_dir = "./data"
results_dir = "./results"
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[model]
framework = "fastai"
family = "efficientnet"
backbone = "efficientnet_b3"
pretrained = true
freeze_epochs = 1

[training]
epochs = 8
batch_size = 16
learning_rate = 0.001
weight_decay = 0.01
optimizer = "adamw"
lr_scheduler = "cosine"
mixed_precision = false

[augmentation]
random_flip = true
max_rotate = 20.0
max_zoom = 1.15
max_lighting = 0.2

[wandb]
enabled = true
project = "colorectal-histology-fastai"
entity = ""
tags = ["fastai", "efficientnet", "histology", "toml"]
log_preds = false
save_artifact = true
