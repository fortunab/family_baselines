# ==============================================================================
# Model 2: Vision Transformer (ViT-Base) Configuration (fastai + TOML + W&B)
# ==============================================================================

[project]
name = "colorectal_histology_fastai"
experiment_name = "vit_base_run"
seed = 0

[data]
data_dir = "./data"
results_dir = "./results"
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[model]
framework = "fastai"
family = "vit"
backbone = "vit_base_patch16_224"
pretrained = true
freeze_epochs = 1

[training]
epochs = 8
batch_size = 16
learning_rate = 0.0003
weight_decay = 0.05
optimizer = "adamw"
lr_scheduler = "cosine"
mixed_precision = false

[augmentation]
random_flip = true
max_rotate = 10.0
max_zoom = 1.05
max_lighting = 0.15

[wandb]
enabled = true
project = "colorectal-histology-fastai"
entity = ""
tags = ["fastai", "vit", "transformer", "histology", "toml"]
log_preds = false
save_artifact = true
