# ==============================================================================
# Model 2: Paige Virchow ViT-H Pathology Foundation Model (skorch + TOML + W&B)
# ==============================================================================

[project]
name = "colorectal_histology_pathology_foundation_skorch"
experiment_name = "virchow_foundation_skorch_run"
seed = 0

[data]
data_dir = "./data"
results_dir = "./results"
image_size = 224
val_split = 0.15
test_split = 0.15
num_classes = 8
subsample = 0

[model]
framework = "skorch"
family = "virchow"
backbone = "paige-ai/Virchow"
model_type = "timm"
pretrained = true
embedding_dim = 1280

[training]
epochs = 8
batch_size = 16
learning_rate = 0.0002
weight_decay = 0.05
optimizer = "adamw"
lr_scheduler = "cosine"
device = "cpu"

[skorch]
max_epochs = 8
lr = 0.0002
early_stopping_patience = 5
cross_val_folds = 3

[wandb]
enabled = true
project = "colorectal-histology-pathology-foundation-skorch"
entity = ""
tags = ["skorch", "virchow", "paige", "foundation", "histology", "toml"]
save_artifact = true
