# Classical ML Family Configuration
classifiers:
  svm_rbf:
    C: 10.0
    kernel: "rbf"
    gamma: "scale"
    class_weight: "balanced"
    probability: true

  random_forest:
    n_estimators: 250
    max_depth: 20
    class_weight: "balanced"
    random_state: 42

  extra_trees:
    n_estimators: 250
    max_depth: 25
    class_weight: "balanced"
    random_state: 42

  gradient_boosting:
    learning_rate: 0.08
    max_iter: 200
    random_state: 42

  mlp:
    hidden_layer_sizes: [256, 128]
    activation: "relu"
    alpha: 0.001
    max_iter: 300
    random_state: 42

  logistic_regression:
    C: 1.0
    penalty: "l2"
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42

  voting_ensemble:
    voting: "soft"
    weights: [2, 2, 1]  # ExtraTrees, SVM, GradBoost
